events {}

http {
  # Resolve the optional realtime sidecar at request time. If it is restarting,
  # only WebSocket upgrades fail; the durable REST/dashboard path stays online.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Preserve the scheme the TLS terminator used. The proxy binds to loopback, so
  # only a trusted local edge (Caddy) can reach it; it forwards the original
  # scheme as X-Forwarded-Proto. Without this, the app rebuilds absolute URLs as
  # http:// behind an HTTPS edge (e.g. the root -> /login redirect). Falls back to
  # $scheme when the proxy is hit directly, as in health probes.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  upstream web_backend {
    server web:3000;
  }

  server {
    listen 3000;
    server_name _;

    location /ws/ {
      set $realtime_backend realtime:3001;
      proxy_pass http://$realtime_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
    }

    location /realtime-health {
      set $realtime_backend realtime:3001;
      proxy_pass http://$realtime_backend/health;
      proxy_set_header Host $http_host;
    }

    location / {
      proxy_pass http://web_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
