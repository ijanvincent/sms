# CI/CD pipeline for the SMS Gateway.
#
# Runs on a self-hosted shell-executor runner installed on the production VM
# (tag: sms-box). Because the runner lives ON the box, "deploy" is just a local
# `docker compose up` — GitLab never needs inbound access to the server.
#
# Flow:  test  ->  build  ->  deploy
#   test   - build the toolchain image and run the unit suite (fail fast)
#   build  - build the production images (runner + migrator)
#   deploy - bring the stack up from those images, then report status

stages:
  - test
  - build
  - deploy

variables:
  # Point every `docker compose` call at the production file by default.
  COMPOSE_FILE: docker-compose.prod.yml
  # Production secrets live ONLY on the VM, never in GitLab. They sit at a path the
  # gitlab-runner user owns and can read; the deploy loads them via --env-file.
  ENV_FILE: /home/gitlab-runner/sms.env

default:
  # Only our self-hosted VM runner carries this tag, so jobs can't accidentally
  # land on (and fail / leak from) GitLab's shared cloud runners.
  tags:
    - sms-box

# 1) TEST — build just the `builder` stage (deps + prisma client + compiled app)
#    and run vitest inside it. devDependencies and the test runner only exist in
#    this stage, never in the slim runtime image.
test:
  stage: test
  script:
    - docker build --target builder -t sms-builder:$CI_COMMIT_SHORT_SHA .
    - docker run --rm sms-builder:$CI_COMMIT_SHORT_SHA npm test
  after_script:
    # Drop the per-commit tag so images don't pile up on the 30 GB disk. The
    # underlying layer cache survives and is reused by the build stage.
    - docker rmi sms-builder:$CI_COMMIT_SHORT_SHA 2>/dev/null || true

# 2) BUILD — build the production runner + migrator images. Layer cache from the
#    test stage makes this fast.
build:
  stage: build
  script:
    - docker compose --env-file "$ENV_FILE" build

# 3) DEPLOY — start/refresh the stack from the images just built, then report.
#    No --build here: the build stage already produced the images on this daemon.
deploy:
  stage: deploy
  script:
    - docker compose --env-file "$ENV_FILE" up -d --remove-orphans
    - docker compose ps
    - docker image prune -f
  environment:
    name: production
