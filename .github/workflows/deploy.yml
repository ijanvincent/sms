name: CI/CD

# Runs on the self-hosted runner installed on the production VM (label: sms-box).
# Because the runner lives ON the box, "deploy" is a local `docker compose up` —
# GitHub never needs inbound access to the server.
#
# Flow: test -> build -> deploy (enforced by `needs:`). All three jobs land on the
# same machine, so they share one Docker daemon: images built in `build` are
# available to `deploy`.

on:
  push:
    # The feature branch is included so we can prove the pipeline before merging.
    # Narrow this to [main] once the deploy work lands on the default branch.
    branches: ["feat/deploy-oracle-gitlab-ci", "main"]
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.prod.yml
  # Production secrets live ONLY on the VM (owner-only file the runner user can
  # read), never in GitHub. The deploy loads them via --env-file.
  ENV_FILE: /home/ubuntu/sms/.env

jobs:
  test:
    runs-on: [self-hosted, sms-box]
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests in the builder image
        run: |
          docker build --target builder -t sms-builder:${{ github.sha }} .
          docker run --rm sms-builder:${{ github.sha }} npm test
      - name: Remove the per-commit test image
        if: always()
        run: docker rmi sms-builder:${{ github.sha }} 2>/dev/null || true

  build:
    needs: test
    runs-on: [self-hosted, sms-box]
    steps:
      - uses: actions/checkout@v4
      - name: Build production images (runner + migrator)
        run: docker compose --env-file "$ENV_FILE" build

  deploy:
    needs: build
    runs-on: [self-hosted, sms-box]
    steps:
      - uses: actions/checkout@v4
      - name: Bring the stack up from the freshly built images
        run: docker compose --env-file "$ENV_FILE" up -d --remove-orphans
      - name: Report container status
        run: docker compose ps
      - name: Prune dangling images to save disk
        run: docker image prune -f
